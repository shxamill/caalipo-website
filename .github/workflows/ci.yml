name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check local server and screenshot utility
        run: |
          node --check serve.mjs
          node --check screenshot.mjs
      - name: Check browser modules
        run: |
          node --experimental-default-type=module --check js/catalog.js
          node --experimental-default-type=module --check js/main.js

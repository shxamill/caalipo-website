name: Bug report
description: Report a reproducible storefront issue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include customer data, payment details, credentials, or personal information."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: false
  - type: input
    id: viewport
    attributes:
      label: Viewport size
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or console output
      description: Redact private information and credentials.
    validations:
      required: false
